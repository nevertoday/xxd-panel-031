<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 031</title>
  <desc>One meaning-led sun-and-bird motif organised by a circle, common axis, tangent, negative space, and boundary crop; rough woodblock ink lives inside precise geometry.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <clipPath id="sun"><circle cx="1000" cy="204" r="112"/></clipPath>
    <pattern id="paper" width="39" height="34" patternUnits="userSpaceOnUse"><path d="M2 8L16 6M23 27L38 24M8 33L18 30" stroke="#302D28" stroke-opacity=".07" stroke-width=".8"/></pattern>
    <filter id="ink" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="3" seed="31" result="grain"/><feComposite in="grain" in2="SourceGraphic" operator="in" result="texture"/><feBlend in="SourceGraphic" in2="texture" mode="multiply"/></filter>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#F2EDDF"/><rect width="1200" height="400" fill="url(#paper)"/>
    <circle cx="1000" cy="204" r="112" fill="#D45B45" filter="url(#ink)"/>
    <g clip-path="url(#sun)">
      <path d="M858 220C919 176 979 165 1040 185C1077 198 1110 226 1145 271C1079 255 1035 256 989 275C940 295 900 283 858 220Z" fill="#263B37" filter="url(#ink)"/>
      <path d="M915 211C950 185 985 183 1020 201C995 218 972 235 949 260C944 234 933 219 915 211Z" fill="#F2EDDF"/>
      <path d="M1040 185L1104 158L1083 212Z" fill="#E7B649" filter="url(#ink)"/>
      <circle cx="1056" cy="190" r="5" fill="#F2EDDF"/>
    </g>
    <path d="M1000 67V337M862 204H1142" stroke="#263B37" stroke-opacity=".34" stroke-width="1.5" stroke-dasharray="8 8"/>
    <path d="M846 316C923 301 1017 314 1154 295" stroke="#263B37" stroke-width="2"/>
    <text x="851" y="340" fill="#263B37" font-family="Arial, sans-serif" font-size="13" letter-spacing="2.8">ONE MEANING / ONE SYSTEM</text>
  </g>
  <g transform="translate(62 50)">
    <rect width="229" height="34" rx="7" fill="#263B37"/><text x="17" y="22" fill="#F2EDDF" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text>
    <text x="0" y="112" fill="#282D2A" font-family="Georgia, serif" font-size="67" font-weight="700" letter-spacing="-3">PANEL <tspan fill="#D45B45">031</tspan></text>
    <text x="2" y="151" fill="#263B37" font-family="Arial, sans-serif" font-size="18" font-weight="900" letter-spacing=".7">MEANING · GEOMETRY · FOLK-RUBBING INK</text>
    <text x="2" y="196" fill="#282D2A" font-family="sans-serif" font-size="18" font-weight="800">寓意先行 · 几何母体 · 民俗图录拓印</text>
    <text x="2" y="226" fill="#282D2A" fill-opacity=".76" font-family="sans-serif" font-size="14" font-weight="700">意味先行の幾何民俗拓印 · 의미 중심의 기하 민속 탁인</text>
    <text x="2" y="256" fill="#282D2A" fill-opacity=".76" font-family="Arial, sans-serif" font-size="14" font-weight="700">رمز هندسي تقوده الدلالة وأثر الطباعة الشعبية</text>
  </g>
  <g transform="translate(62 327)">
    <rect width="151" height="37" rx="7" fill="#263B37"/><text x="75.5" y="24" text-anchor="middle" fill="#F2EDDF" font-family="Courier New, monospace" font-size="12" font-weight="900">ONE MOTIF</text>
    <rect x="163" width="169" height="37" rx="7" fill="#D45B45"/><text x="247.5" y="24" text-anchor="middle" fill="#F2EDDF" font-family="Courier New, monospace" font-size="12" font-weight="900">GEOMETRIC PARENT</text>
    <rect x="344" width="107" height="37" rx="7" fill="#E7B649"/><text x="397.5" y="24" text-anchor="middle" fill="#282D2A" font-family="Courier New, monospace" font-size="12" font-weight="900">4 MODES</text>
    <rect x="463" width="180" height="37" rx="7" fill="#A9B1A1"/><text x="553" y="24" text-anchor="middle" fill="#282D2A" font-family="Courier New, monospace" font-size="12" font-weight="900">WALLPAPER PACK</text>
  </g>
</svg>
